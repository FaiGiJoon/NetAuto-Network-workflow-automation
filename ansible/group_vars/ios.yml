# Cisco IOS / IOS-XE over SSH.
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.ios.ios
ansible_user: "{{ lookup('env', 'NET_USER') }}"
ansible_password: "{{ lookup('env', 'NET_PASSWORD') }}"
ansible_become: true
ansible_become_method: enable
ansible_become_password: "{{ lookup('env', 'NET_ENABLE_PASSWORD') | default(lookup('env', 'NET_PASSWORD'), true) }}"
